name: Import FixLib sources and build

on:
  push:
    branches: [fixlib-source-ci]
    paths:
      - '.github/workflows/fixlib-source-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FixLib
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Import original source and apply FixLib changes
        run: python3 tools/import_source.py

      - name: Publish source into the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common fabric neoforge buildSrc gradle build.gradle.kts settings.gradle.kts gradle.properties gradlew gradlew.bat lombok.config .gitignore
          if ! git diff --cached --quiet; then
            git commit -m "Publish FixLib Java sources derived from ukulib"
            git push
          fi

      - name: Build source with Gradle
        run: |
          chmod +x gradlew
          ./gradlew :fabric:build --no-daemon --stacktrace

      - name: Save build outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fixlib-fabric-source-build
          path: |
            build/libs/*.jar
            fabric/build/libs/*.jar
          if-no-files-found: warn
